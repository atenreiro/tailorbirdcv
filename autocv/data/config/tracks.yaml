# Career tracks (general) — how evidence is ordered and framed. Emphasis only, never facts.

manager:
  detect: [head of, director, manager, lead a team, people leadership, budget, build the team, direct reports]
  headline_tracks: [manager, hybrid]
  highlights_order: [teams and functions built, outcomes at scale, budget and ownership, process and governance, people developed]
  bullet_style: lead with scope (team size, budget, remit) then outcome; keep 1–2 hands-on bullets for credibility
  keep: [team sizes, budgets, senior stakeholders, people developed]

ic:
  detect: [senior, principal, staff, specialist, expert, hands-on, individual contributor, architect]
  headline_tracks: [ic, hybrid]
  highlights_order: [measurable outcomes, things built or delivered, expertise and depth, scale, recognition]
  bullet_style: lead with what was built or delivered and its measurable effect; compress people-management bullets
  keep: [tools and methods actually used, depth of expertise, measurable results]
  note: still keep evidence of leadership and influence — senior individual contributor roles value it

hybrid:
  detect: [team lead, player-coach, hands-on leader, lead, technical manager]
  headline_tracks: [hybrid, manager, ic]
  highlights_order: [things built with measurable impact, small-team leadership, ownership, scale]
  bullet_style: alternate built-it and led-it evidence; make the player-coach balance explicit
  keep: [team sizes, hands-on work, coaching and promotions]
