# Industry lenses (general) — EMPHASIS heuristics only. They never add facts: they decide what to
# surface first and which vocabulary to mirror when the profile already has the evidence.
# Override them for yourself in <data folder>/config/industries.yaml, or pick a domain pack in Settings.

banking:
  signals: [bank, financial institution, regulator, compliance, risk, audit, wealth, insurance]
  lead_with: [risk & control ownership, regulatory engagement, governance, delivery at scale, stakeholder management]
  mirror_terms: [risk management, control framework, compliance, audit, operational resilience]
  surface: [regulated environments, audit outcomes, executive reporting, measurable risk reduction]
  tone: measured and precise; quantify risk reduction, accuracy and assurance

tech:
  signals: [SaaS, platform, product, engineering, startup, scale, cloud, developer, data]
  lead_with: [things built and shipped, measurable impact, scale, ownership, speed]
  mirror_terms: [ship, scale, ownership, automation, metrics, customers]
  surface: [products and systems built, growth and efficiency metrics, tools and platforms used]
  tone: builder voice; concrete outcomes over process

fintech:
  signals: [payments, wallet, digital bank, lending, crypto, exchange, fraud, KYC]
  lead_with: [growth with control, payments and fraud outcomes, building from zero, regulation plus product]
  mirror_terms: [payments, fraud prevention, onboarding, conversion, compliance]
  surface: [transaction volume and users, fraud loss reduction, launches]
  tone: growth-stage builder; outcomes in users, volume and loss

consulting:
  signals: [advisory, consulting, client-facing, engagements, Big Four, transformation]
  lead_with: [client outcomes, executive communication, frameworks and assessments, stakeholder management]
  mirror_terms: [client, engagement, assessment, roadmap, transformation, recommendations]
  surface: [engagements delivered, client impact, methodologies, presentations]
  tone: structured, outcome-oriented, client-ready

healthcare:
  signals: [hospital, clinical, patient, healthcare, pharma, biotech, medical, care]
  lead_with: [patient or clinical outcomes, quality and safety, compliance, cross-functional care delivery]
  mirror_terms: [patient care, clinical, quality, safety, compliance, outcomes]
  surface: [patient volumes, quality metrics, accreditation and audits, protocols improved]
  tone: precise and caring; evidence-based outcomes

public_sector:
  signals: [government, ministry, agency, public sector, policy, citizens, defence, NGO]
  lead_with: [public outcomes, policy and programme delivery, governance, stakeholder engagement]
  mirror_terms: [programme, policy, stakeholders, public service, governance, procurement]
  surface: [programmes delivered, budgets managed, citizens or users served]
  tone: formal and outcome-focused

telco:
  signals: [telecom, operator, mobile network, carrier, 5G, connectivity]
  lead_with: [network and service scale, operations, building functions, partner ecosystems]
  mirror_terms: [network, operator, carrier-grade, availability, subscribers]
  surface: [subscriber scale, uptime and service quality, rollouts]
  tone: operational scale and reliability

retail:
  signals: [retail, e-commerce, consumer, brand, marketplace, store, FMCG, CPG]
  lead_with: [customer and revenue outcomes, growth, operations at scale, brand]
  mirror_terms: [customer, conversion, revenue, merchandising, omnichannel]
  surface: [sales and growth figures, customer metrics, launches and campaigns]
  tone: commercial and customer-centred

industrial:
  signals: [manufacturing, plant, supply chain, logistics, engineering, energy, construction, automotive]
  lead_with: [operational efficiency, safety, quality, cost and delivery outcomes]
  mirror_terms: [operations, safety, quality, lean, supply chain, uptime]
  surface: [throughput and cost improvements, safety record, projects delivered]
  tone: practical and results-driven

education:
  signals: [school, university, education, learning, research, nonprofit, foundation]
  lead_with: [learner or mission outcomes, programmes built, research and teaching, partnerships]
  mirror_terms: [students, learning outcomes, curriculum, research, community, mission]
  surface: [programmes and courses, people reached, grants and publications]
  tone: mission-driven and clear
