name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]  # the oldest supported, and a current one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

  libreoffice:
    name: Real PDF · LibreOffice · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: |
          # the download server is sometimes slow or unreachable: retry before failing
          for i in 1 2 3; do brew install --cask libreoffice && exit 0; sleep 60; done; exit 1
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # LibreOffice's download server is sometimes unreachable: retry before failing.
          foreach ($i in 1..3) {
            choco install libreoffice-fresh -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 60
          }
          exit 1
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_pdf_real.py tests/test_pdf.py tests/test_oscompat.py -rs
        env:
          AUTOCV_EXPECT_LIBREOFFICE: "1"

  package:
    name: Installable package · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel in a clean environment and check it outside the checkout
        shell: bash
        run: |
          uv venv ../clean
          uv pip install --python ../clean $(ls dist/*.whl)
          cd ..
          if [ -x clean/Scripts/python.exe ]; then PY=clean/Scripts/python.exe; else PY=clean/bin/python; fi
          $PY -m autocv.cli --version
          $PY -c "from autocv import paths; assert paths.web_dir() and not paths.is_checkout(); assert (paths.DATA / 'templates' / 'base.docx').is_file(); print(paths.private_dir())"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl

  installer:
    # install.sh / install.ps1 exactly as users run them (piped), installing this commit's wheel instead of PyPI's.
    name: One-line installer · ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install, update and uninstall with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          export AUTOCV_PACKAGE="$(ls "$PWD"/dist/*.whl)"
          command -v uv || echo "no uv on this runner: the script installs it"
          sh -s -- --no-launch < install.sh                 # as `curl … | sh -s -- --no-launch`
          "$HOME/.local/bin/autocv" --version
          "$(uv tool dir 2>/dev/null || echo "$HOME/.local/share/uv/tools")/autocv-app/bin/python" --version | grep -q '^Python 3\.13\.'
          if [ "$RUNNER_OS" = macOS ]; then zsh -ic 'autocv --version'; else bash -lc 'autocv --version'; fi  # a new terminal finds it
          # while AutoCV runs, updating and uninstalling are refused (they'd swap its files out from under it)
          AUTOCV_PRIVATE="$RUNNER_TEMP/data" "$HOME/.local/bin/autocv" serve --no-browser --port 8765 & pid=$!
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          if sh -s -- --no-launch < install.sh 2> refused.txt; then echo "updated a running AutoCV"; exit 1; fi
          grep -q "AutoCV is running" refused.txt
          kill "$pid"; wait "$pid" || true
          sh -s -- --no-launch < install.sh                 # running it again updates in place
          sh -s -- --uninstall < install.sh
          test ! -e "$HOME/.local/bin/autocv"
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:AUTOCV_PACKAGE = (Resolve-Path dist\*.whl).Path
          $env:AUTOCV_NO_LAUNCH = '1'
          if (Get-Command uv -ErrorAction SilentlyContinue) { 'uv already on this runner' } else { 'no uv on this runner: the script installs it' }
          Get-Content -Raw install.ps1 | Invoke-Expression   # as `irm … | iex`
          $exe = Join-Path $env:USERPROFILE '.local\bin\autocv.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $env:USERPROFILE '.local\bin\uv.exe' }
          $toolPython = Join-Path (& $uv tool dir).Trim() 'autocv-app\Scripts\python.exe'
          $py = & $toolPython --version
          if ($py -notmatch '^Python 3\.13\.') { throw "AutoCV runs on $py, not Python 3.13" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | ForEach-Object { $_.TrimEnd('\') }
          if ($userPath -notcontains (Split-Path $exe)) { throw 'the user PATH does not include autocv' }
          if ($env:UV_MANAGED_PYTHON) { throw 'the installer left its uv settings in this window' }
      - name: Update and uninstall with install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AUTOCV_PACKAGE = (Resolve-Path dist\*.whl).Path
          $env:AUTOCV_NO_LAUNCH = '1'
          $exe = Join-Path $env:USERPROFILE '.local\bin\autocv.exe'
          # while AutoCV runs, updating and uninstalling are refused (Windows locks a running program's files)
          $env:AUTOCV_PRIVATE = Join-Path $env:RUNNER_TEMP 'data'
          Start-Process -FilePath $exe -ArgumentList 'serve', '--no-browser', '--port', '8765' -WindowStyle Hidden
          foreach ($i in 1..30) {
            try { (New-Object Net.Sockets.TcpClient).Connect('127.0.0.1', 8765); break } catch { Start-Sleep -Seconds 1 }
          }
          $out = Get-Content -Raw install.ps1 | Invoke-Expression *>&1 | Out-String
          if ($out -notmatch 'AutoCV is running') { throw "a running AutoCV wasn't detected: $out" }
          $env:AUTOCV_UNINSTALL = '1'
          $out = Get-Content -Raw install.ps1 | Invoke-Expression *>&1 | Out-String
          if ($out -notmatch 'AutoCV is running') { throw "uninstalled a running AutoCV: $out" }
          if (-not (Test-Path $exe)) { throw 'autocv.exe went missing' }
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $env:USERPROFILE '.local\bin\uv.exe' }
          $tools = (Join-Path (& $uv tool dir).Trim() 'autocv-app') + '\'
          Get-Process | Where-Object { $_.Path -and ($_.Path -eq $exe -or $_.Path.StartsWith($tools, [StringComparison]::OrdinalIgnoreCase)) } | Stop-Process -Force
          Start-Sleep -Seconds 2
          Get-Content -Raw install.ps1 | Invoke-Expression   # running it again updates in place
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:AUTOCV_UNINSTALL = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (Test-Path $exe) { throw 'autocv.exe is still there after uninstalling' }
          if ($env:AUTOCV_UNINSTALL) { throw 'AUTOCV_UNINSTALL was not cleared' }
