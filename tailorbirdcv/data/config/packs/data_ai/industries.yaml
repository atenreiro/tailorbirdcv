# Data & AI pack — industry lenses. EMPHASIS heuristics only. These are never facts: they only decide what
# to surface first and which vocabulary to mirror when the profile already has the evidence.
# Never add a claim because a lens mentions it.

banking:
  signals: [bank, credit risk, trading, quant, regulatory reporting, model risk, insurance, AML]
  lead_with: [models and data in regulated use, model risk and governance, data quality, business decisions supported]
  mirror_terms: [model risk, validation, data governance, regulatory reporting, explainability, data lineage]
  surface: [models deployed, losses or risk reduced, reports automated, data quality improved]
  tone: precise and controlled; accuracy and governance

tech:
  signals: [SaaS, platform, product analytics, machine learning, LLM, recommendation, search, data platform]
  lead_with: [models and pipelines in production, measurable product impact, scale, experimentation]
  mirror_terms: [production ML, data pipelines, experimentation, A/B testing, LLM, MLOps, latency]
  surface: [metric lift from models, data volumes, latency and cost, experiments run]
  tone: builder voice; production impact over research

fintech:
  signals: [payments, lending, fraud, credit scoring, digital bank, crypto, KYC, AML]
  lead_with: [fraud and credit models, real-time decisioning, measurable loss and approval effects, compliance]
  mirror_terms: [fraud detection, credit scoring, real-time, decisioning, false positives, compliance]
  surface: [fraud losses reduced, approval rates, false positives cut, volumes scored]
  tone: metric-driven and controlled

