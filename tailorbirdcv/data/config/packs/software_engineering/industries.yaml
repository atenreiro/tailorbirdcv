# Software Engineering pack — industry lenses. EMPHASIS heuristics only. These are never facts: they only
# decide what to surface first and which vocabulary to mirror when the profile already has the evidence.
# Never add a claim because a lens mentions it.

banking:
  signals: [bank, trading, core banking, payments, regulated, low latency, mainframe, risk systems]
  lead_with: [reliability and correctness, systems at scale, secure and compliant delivery, legacy modernization]
  mirror_terms: [high availability, resilience, data integrity, audit trail, latency, regulatory requirements]
  surface: [uptime and SLOs, transaction volumes, migrations completed, incidents reduced]
  tone: precise and reliability-first; quantify correctness, availability and risk removed

tech:
  signals: [SaaS, platform, product engineering, startup, scale-up, cloud-native, developer tools, API]
  lead_with: [products and features shipped, scale and performance, end-to-end ownership, developer velocity]
  mirror_terms: [ship, ownership, scale, latency, throughput, CI/CD, observability]
  surface: [users or requests served, performance and cost gains, launches, open-source work]
  tone: builder voice; concrete systems shipped and their measurable effect

fintech:
  signals: [payments, wallet, lending, digital bank, crypto, exchange, ledger, KYC]
  lead_with: [payment and ledger systems, correctness under load, security and compliance by design, fast iteration]
  mirror_terms: [transaction processing, reconciliation, ledger, fraud prevention, onboarding, compliance]
  surface: [transaction volume, latency, failure rates reduced, products launched]
  tone: growth-stage builder; correctness and speed together

consulting:
  signals: [consultancy, agency, systems integrator, client delivery, outsourcing, digital transformation]
