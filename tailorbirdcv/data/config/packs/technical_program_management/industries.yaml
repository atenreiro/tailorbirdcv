# Technical Program Management pack — industry lenses. EMPHASIS heuristics only. These are never facts: they
# only decide what to surface first and which vocabulary to mirror when the profile already has the evidence.
# Never add a claim because a lens mentions it.

banking:
  signals: [bank, financial institution, regulated, core banking, risk, compliance, resilience, migration]
  lead_with: [large technology programmes under regulation, platform migrations, risk and dependency management, executive reporting]
  mirror_terms: [programme, dependencies, regulatory commitments, migration, operational resilience, governance]
  surface: [systems migrated, regulatory deadlines met, teams coordinated, risk retired]
  tone: measured and precise; control and predictability

tech:
  signals: [SaaS, platform, infrastructure, product, cloud, scale, engineering org, launch]
  lead_with: [cross-team technical launches, platform and infrastructure programmes, technical depth, execution at scale]
  mirror_terms: [launch, cross-functional, dependencies, roadmap, OKRs, execution, technical trade-offs]
  surface: [launches delivered, number of teams aligned, latency, cost or reliability gains, timelines]
  tone: engineering-fluent and crisp; outcomes and trade-offs

fintech:
  signals: [payments, wallet, digital bank, lending, crypto, exchange, ledger]
  lead_with: [payment platform launches, integrations with partners and regulators, reliability, fast execution]
  mirror_terms: [launch, integration, partners, compliance, reliability, roadmap]
  surface: [markets or partners launched, volume enabled, go-lives, incident reductions]
  tone: fast-moving and technically grounded

