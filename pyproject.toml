[project]
name = "tailorbirdcv"
dynamic = ["version"]  # from the VERSION file: bump it on main and CI releases it (see release.yml)
description = "Tailor your resume to a job description without inventing anything — a local web app"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["resume", "cv", "job application", "ats", "claude", "openai", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
    "platformdirs>=4.0",
    "anthropic>=1.11",  # messages.create(output_config=…) structured outputs, as tested
    "keyring>=25",
    "openai>=3.24",  # Responses API with strict json_schema, as tested
    "truststore>=0.10",  # update checks trust the OS certificates (company proxies that inspect HTTPS)
]

[project.scripts]
tailorbirdcv = "tailorbirdcv.cli:main"  # also what `uvx tailorbirdcv` runs

[project.urls]
Homepage = "https://github.com/atenreiro/tailorbirdcv"
Changelog = "https://github.com/atenreiro/tailorbirdcv/blob/main/CHANGELOG.md"
Issues = "https://github.com/atenreiro/tailorbirdcv/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\d+\.\d+\.\d+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["tailorbirdcv"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles the built web UI (web/dist) as tailorbirdcv/web

[tool.hatch.build.targets.sdist]
include = ["/tailorbirdcv", "/web/dist", "/README.md", "/CHANGELOG.md", "/hatch_build.py", "/VERSION"]  # anchored: nothing from node_modules or worktrees
artifacts = ["/web/dist/**"]  # git-ignored, but the wheel built from the sdist needs it

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]  # a VERSION bump refreshes the editable install's version

[tool.pytest.ini_options]
testpaths = ["tests"]
