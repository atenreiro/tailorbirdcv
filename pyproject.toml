[project]
name = "autocv"
version = "0.1.0"
description = "Tailor a fact-locked master resume to a job description"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
]

[project.scripts]
autocv = "autocv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autocv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
