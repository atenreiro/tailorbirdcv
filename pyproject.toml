[project]
name = "autocv-app"
version = "0.2.0"
description = "Tailor your resume to a job description without inventing anything — a local web app"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["resume", "cv", "job application", "ats", "claude", "openai", "openrouter"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
    "platformdirs>=4.0",
    "anthropic>=1.11",  # messages.create(output_config=…) structured outputs, as tested
    "keyring>=25",
    "openai>=3.24",  # Responses API with strict json_schema, as tested
]

[project.scripts]
autocv = "autocv.cli:main"
autocv-app = "autocv.cli:main"  # so `uvx autocv-app` works

[project.urls]
Homepage = "https://github.com/atenreiro/autocv"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autocv"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles the built web UI (web/dist) as autocv/web

[tool.hatch.build.targets.sdist]
include = ["/autocv", "/web/dist", "/README.md", "/CHANGELOG.md", "/hatch_build.py"]  # anchored: nothing from node_modules or worktrees
artifacts = ["/web/dist/**"]  # git-ignored, but the wheel built from the sdist needs it

[tool.pytest.ini_options]
testpaths = ["tests"]
